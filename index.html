<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inferno AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="welcome" class="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.1L22 12l-7.6 2.9L12 22l-2.4-7.1L2 12l7.6-2.9z"/></svg>
    </div>
    <h2>Welcome to Inferno AI</h2>
    <p>Ask questions, learn faster, and get ideas in seconds.</p>
    <button id="start">Get Started →</button>
  </div>

  <div class="app">
    <aside class="sidebar">
      <h1 class="logo">Inferno <span>AI</span></h1>
      <button id="newChat" class="new-chat">+ New Chat</button>
      <p class="side-note">Chat history coming soon</p>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="msg bot">Hi, I'm Inferno. Ask me anything!</div>
      </div>

      <div id="loading" class="loading hidden">Inferno is thinking...</div>
      <div id="error" class="error hidden"></div>

      <div class="input-bar">
        <input id="input" type="text" placeholder="Type your question..." autocomplete="off" />
        <button id="send">Send</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const newChat = document.getElementById('newChat');
    const welcome = document.getElementById('welcome');
    const startBtn = document.getElementById('start');

    startBtn.addEventListener('click', () => {
      welcome.classList.add('leave');
      input.focus();
    });

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      if (who === 'bot') {
        div.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        div.textContent = text;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showError(text) {
      errorBox.textContent = text;
      errorBox.classList.remove('hidden');
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      errorBox.classList.add('hidden');
      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;
      loading.classList.remove('hidden');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        addMessage(data.reply, 'bot');
      } catch (err) {
        showError(err.message);
      } finally {
        sendBtn.disabled = false;
        loading.classList.add('hidden');
        input.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    newChat.addEventListener('click', () => {
      messages.innerHTML = '<div class="msg bot">Hi, I\'m Inferno. Ask me anything!</div>';
      errorBox.classList.add('hidden');
    });
  </script>
</body>
</html>
